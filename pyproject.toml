[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opra"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opra"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["opra"]
branch = true
omit = ["src/opra/app/main.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
